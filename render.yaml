services:
  - type: web
    name: ai-knowledge-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "0"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: hemanthkonduri32@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: AI Knowledge System <hemanthkonduri32@gmail.com>
      - key: MAIL_RELAY_URL
        value: https://processor-independent-workers-bat.trycloudflare.com
